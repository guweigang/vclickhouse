name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plain-native-tcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.7
        with:
          stable: true
      - run: v fmt -verify src
      - run: v test src

  openssl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.7
        with:
          stable: true
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: v -d vclickhouse_openssl test src
